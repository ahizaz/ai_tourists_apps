name: Bug report
description: Report a reproducible problem in AI Tourists.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and version
      placeholder: Android 14, app 0.1.0+13
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, tokens, personal data, and other sensitive values before sharing.
