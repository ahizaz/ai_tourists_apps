name: ai_powered_tourists_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^6.3.2
  google_maps_flutter: ^2.13.1
  geocoding: ^3.0.0
  geolocator: ^13.0.1
  http: ^1.6.0
  image_picker: ^1.2.0
  pinput: ^5.0.2
  just_audio: ^0.9.42
  url_launcher: ^6.3.2
  flutter_easyloading: ^3.0.5
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0
  flutter_svg: ^2.0.7
  flutter_launcher_icons: ^0.14.4
  share_plus: ^12.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/terms/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/applogo.png"
